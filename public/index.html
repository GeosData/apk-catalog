<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APKs Geosdata</title>
<meta name="description" content="Descargas de apps Android de Geosdata y herramientas de terceros.">
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--muted:#6b675f;--line:#dcd8cd;--card:#fffdf8;--accent:#1f5f4a}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#ece9e1;--muted:#9a968b;--line:#2c2a26;--card:#1b1a17;--accent:#6fcfa8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px 80px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 32px}
.product{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.product h2{margin:0;font-size:1.15rem}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.summary{color:var(--muted);margin:6px 0 14px}
.release{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.meta{font-size:.85rem;color:var(--muted)}
a.btn{background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 16px;border-radius:999px}
a.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hash{font:.72rem ui-monospace,Consolas,monospace;color:var(--muted);word-break:break-all;flex-basis:100%}
.credit{font-size:.82rem;color:var(--muted);margin-top:10px}
.credit a{color:inherit}
footer{margin-top:32px;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>APKs</h1>
<p class="lead">Versiones de prueba para Android. Son builds debug para instalación personal: al abrir el archivo, Android te pedirá permitir la instalación desde el navegador.</p>
<div id="list" aria-live="polite">Cargando…</div>
<footer>Verifica el SHA-256 si quieres comprobar que el archivo no cambió.</footer>
</main>
<script>
const list=document.getElementById("list");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("catalog.json").then(r=>r.json()).then(({products})=>{
list.innerHTML=products.map(p=>{
const rels=p.releases.slice(0,3).map(r=>`<div class="release"><div><strong>${esc(r.version)}</strong> <span class="meta">${esc(r.variant)} · ${esc(r.size_mb)} MB · ${esc(r.date)}</span></div><a class="btn" href="${esc(r.url)}">Descargar</a><div class="hash">sha256 ${esc(r.sha256)}</div></div>`).join("");
const credit=p.origin==="third"?`<p class="credit">Proyecto de ${esc(p.author)}, licencia ${esc(p.license)}. <a href="${esc(p.source)}">Código fuente</a>.</p>`:"";
return `<section class="product"><h2>${esc(p.name)}${p.origin==="third"?'<span class="tag">tercero</span>':""}</h2><p class="summary">${esc(p.summary)}</p>${rels}${credit}</section>`}).join("");
}).catch(()=>{list.textContent="No se pudo cargar el catálogo."});
</script>
</body>
</html>
